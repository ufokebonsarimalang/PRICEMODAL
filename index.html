<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Master Harga</title>

  <style>
    body {
      font-family: Arial;
      margin: 0;
      background: #f4f6fb;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .header {
      width: 100%;
      background: #1e88e5;
      color: white;
      padding: 15px;
      text-align: center;
      font-weight: bold;
    }

    /* CENTER CONTAINER */
    .container {
      width: 100%;
      max-width: 500px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .card {
      width: 90%;
      margin-top: 15px;
      background: white;
      padding: 15px;
      border-radius: 12px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.1);
    }

    input {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border-radius: 8px;
      border: 1px solid #ddd;
      text-align: center; /* INPUT JADI CENTER */
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 12px;
      background: #1e88e5;
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }

    .item {
      padding: 12px;
      border-bottom: 1px solid #eee;
    }

    .harga {
      font-weight: bold;
      color: green;
      font-size: 16px;
    }

    /* LOGO BESAR */
    .logo {
      margin: 20px 0;
      text-align: center;
    }

    .logo img {
      width: 80%;
      max-width: 350px;
      opacity: 0.9;
    }
  </style>
</head>

<body>

<div class="header">
  💰 MASTER HARGA TOKO
</div>

<div class="container">

  <div class="card">
    <input id="tipe" placeholder="Cari tipe (contoh: A14)">
    <button onclick="cari()">CARI</button>
  </div>

  <div class="card" id="hasil">
    Hasil akan muncul di sini
  </div>

  <!-- LOGO BESAR DI BAWAH -->
  <div class="logo">
    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/5/51/Google.png/640px-Google.png">
  </div>

</div>

<script>

const API_URL = "https://script.google.com/macros/s/AKfycbwji5nEEIX2kDDhTygYVg9zAqiZd3ppBzWPr8UH-eLRcE56EeDP187BOliW4JW0F2a64Q/exec";

function formatRupiah(angka) {
  return angka.toLocaleString('id-ID');
}

function cari() {

  let tipe = document.getElementById("tipe").value;
  let h = document.getElementById("hasil");

  h.innerHTML = "⏳ mencari...";

  fetch(API_URL + "?tipe=" + tipe)
  .then(res => res.json())
  .then(data => {

    if (!data || data.length === 0) {
      h.innerHTML = "❌ Tidak ditemukan";
      return;
    }

    let html = "";

    data.forEach(item => {
      html += `
        <div class="item">
          <div>${item.nama || '-'}</div>
          <div class="harga">Rp ${formatRupiah(item.harga || 0)}</div>
        </div>
      `;
    });

    h.innerHTML = html;
  });

}

</script>

</body>
</html>
