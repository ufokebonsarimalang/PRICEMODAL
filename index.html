<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rate Pengiriman</title>

<style>
body{
  font-family:Arial;
  margin:0;
  padding:15px;
  background:#0f172a;
  color:white;
}

input,select{
  width:100%;
  padding:12px;
  margin-bottom:10px;
  border-radius:8px;
  border:none;
  box-sizing:border-box;
}

button{
  width:100%;
  padding:14px;
  background:#22c55e;
  color:white;
  border:none;
  border-radius:8px;
  font-weight:bold;
}

.box{
  background:#1e293b;
  padding:15px;
  border-radius:10px;
}

.sjbox{
  display:flex;
  margin-bottom:10px;
}

.sjprefix{
  background:#334155;
  padding:12px;
  border-radius:8px 0 0 8px;
  white-space:nowrap;
}

.sjinput{
  margin-bottom:0;
  border-radius:0 8px 8px 0;
}
</style>

</head>

<body>

<div style="text-align:center;margin-bottom:15px;">   <img src="logo.png"        style="width:100px;height:100px;border-radius:50%;object-fit:cover;">   <h2>INPUT RATE PENGIRIMAN</h2> </div>

<div class="box">

<select id="driver">
  <option value="">Pilih Driver</option>
  <option value="PONIADI">PONIADI</option>
  <option value="EKO">EKO</option>
  <option value="SENDI">SENDI</option>
</select>

<select id="kernet">
  <option value="">Pilih Kernet</option>
  <option value="DWI">DWI</option>
  <option value="FRIZA">FRIZA</option>
  <option value="RUDI">RUDI</option>
</select>

<div class="sjbox">
  <span class="sjprefix" id="prefixSJ"></span>
  <input id="sj" class="sjinput" placeholder="Nomor SJ">
</div>

<select id="tipe">
  <option value="DK">DK</option>
  <option value="LK">LK</option>
</select>

<button onclick="kirim()">SIMPAN</button>

<p id="status"></p>

</div>

<script>

const GAS_URL = "https://script.google.com/macros/s/AKfycbx0y4uB9HiQFRRclbeoVH73IxppnjYB5dWX_JLJO96G14eNLQ1bFRCK1TsKaJ9-OxS3/exec";
const sekarang = new Date();

const prefixSJ =
String(sekarang.getFullYear()).slice(-2) +
String(sekarang.getMonth() + 1).padStart(2,'0') +
"/";

document.getElementById("prefixSJ").innerText = prefixSJ;
function kirim(){

  if(!driver.value || !sj.value){
    document.getElementById("status").innerText = "Driver & SJ wajib diisi";
    return;
  }

  document.getElementById("status").innerText = "Mengirim...";

  fetch(GAS_URL,{
    method:"POST",
    body: JSON.stringify({
      driver: driver.value,
      kernet: kernet.value,
      sj: prefixSJ + sj.value,
      tipe: tipe.value
    })
  })
  .then(r=>r.text())
  .then(res=>{

    document.getElementById("status").innerText = "SUKSES ✔";

    driver.value="";
    kernet.value="";
    sj.value="";
    tipe.value="DK";

  })
  .catch(()=>{

    document.getElementById("status").innerText = "ERROR ❌";

  });

}

</script>

</body>
</html>
