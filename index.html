<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Master Harga</title>

  <style>
    body {
      font-family: Arial;
      margin: 0;
      background: #f4f6fb;
    }

 .header {
  background: #1e88e5;
  color: white;
  padding: 15px;

  width: 100%;
  box-sizing: border-box;

  text-align: center;
  font-weight: bold;

  margin: 0;
}
    .card {
      margin: 15px;
      background: white;
      padding: 15px;
      border-radius: 12px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.1);
    }

    /* ✅ HANYA INI TAMBAHAN (CENTER CARD SEARCH SAJA) */
    .search-card {
      max-width: 500px;
      margin-left: auto;
      margin-right: auto;
    }

    input {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border-radius: 8px;
      border: 1px solid #ddd;
      box-sizing: border-box;
    }

    button {
      width: 100%;
      padding: 12px;
      background: #1e88e5;
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: bold;
    }

    .item {
      padding: 12px;
      border-bottom: 1px solid #eee;
    }

    .harga {
      font-weight: bold;
      color: green;
      font-size: 16px;
    }
  </style>
</head>

<body>

<div class="header">
  💰 MASTER HARGA TOKO
</div>

<!-- ✅ ONLY SEARCH CARD CENTER -->
<div class="card search-card">
  <input id="tipe" placeholder="Cari tipe (contoh: A14)">
  <button onclick="cari()">CARI</button>
</div>

<div class="card" id="hasil">
  Hasil akan muncul di sini
</div>

<script>

const API_URL = "https://script.google.com/macros/s/AKfycbwji5nEEIX2kDDhTygYVg9zAqiZd3ppBzWPr8UH-eLRcE56EeDP187BOliW4JW0F2a64Q/exec";

function formatRupiah(angka) {
  return Number(angka).toLocaleString('id-ID');
}

// SEARCH (TIDAK DIUBAH)
function cari() {

  let tipe = document.getElementById("tipe").value;
  let h = document.getElementById("hasil");

  h.innerHTML = "⏳ mencari...";

  fetch(API_URL + "?tipe=" + encodeURIComponent(tipe))
  .then(res => res.json())
  .then(result => {

    let data = result.data;

    if (!data || data.length === 0) {
      h.innerHTML = "❌ Tidak ditemukan";
      return;
    }

    let html = "";

    data.forEach(item => {

      let modal = item.modal || 0;
      let margin = item.margin || 0;
      let harga = item.harga || 0;

      html += `
        <div class="item">

          <b>${item.brand}</b><br>
          <small>${item.tipe}</small><br><br>

          💰 Modal: ${formatRupiah(modal)}<br>
          📊 Margin: ${formatRupiah(margin)}<br>
          🏷️ Harga: <span class="harga">${formatRupiah(harga)}</span>

        </div>
      `;
    });

    h.innerHTML = html;

  })
  .catch(err => {
    console.log(err);
    h.innerHTML = "❌ Error koneksi API";
  });
}
  .catch(() => {
    h.innerHTML = "❌ Error koneksi API";
  });
}

</script>

</body>
</html>
