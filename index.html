<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Master Harga</title>

  <style>
    body {
      font-family: Arial;
      margin: 0;
      background: #f4f6fb;
    }

    .header {
      background: #1e88e5;
      color: white;
      padding: 15px;
      text-align: center;
      font-weight: bold;
    }

    .card {
      margin: 15px;
      background: white;
      padding: 15px;
      border-radius: 12px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.1);
    }

    input {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border-radius: 8px;
      border: 1px solid #ddd;
      box-sizing: border-box;
      text-align: center;
    }

    button {
      width: 100%;
      padding: 12px;
      background: #1e88e5;
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }

    .item {
      padding: 12px;
      border-bottom: 1px solid #eee;
    }

    .row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 4px 0;
    }

    .icon {
      width: 18px;
      text-align: center;
    }

    .harga {
      font-weight: bold;
      color: green;
      font-size: 16px;
    }
  </style>
</head>

<body>

<div class="header">
  💰 MASTER HARGA TOKO
</div>

<div class="card">
  <input id="tipe" placeholder="Cari tipe (contoh: A14)">
  <button onclick="cari()">CARI</button>
</div>

<div class="card" id="hasil">
  Hasil akan muncul di sini
</div>

<script>

const API_URL = "https://script.google.com/macros/s/AKfycbwji5nEEIX2kDDhTygYVg9zAqiZd3ppBzWPr8UH-eLRcE56EeDP187BOliW4JW0F2a64Q/exec";

function formatRupiah(angka) {
  return Number(angka).toLocaleString('id-ID');
}

// ==========================
// SEARCH
// ==========================
function cari() {

  let tipe = document.getElementById("tipe").value;
  let h = document.getElementById("hasil");

  h.innerHTML = "⏳ mencari...";

  fetch(API_URL + "?tipe=" + encodeURIComponent(tipe))
  .then(res => res.json())
  .then(data => {

    if (!data || data.length === 0) {
      h.innerHTML = "❌ Tidak ditemukan";
      return;
    }

    let html = "";

    data.forEach(item => {

      html += `
        <div class="item">

          <div class="row">
            <div class="icon">📦</div>
            <div>Modal: ${formatRupiah(item.modal || 0)}</div>
          </div>

          <div class="row">
            <div class="icon">📊</div>
            <div>Margin: ${formatRupiah(item.margin || 0)}</div>
          </div>

          <div class="row">
            <div class="icon">💰</div>
            <div class="harga">Harga: ${formatRupiah(item.harga || 0)}</div>
          </div>

        </div>
      `;
    });

    h.innerHTML = html;
  })
  .catch(() => {
    h.innerHTML = "❌ Error koneksi API";
  });

}

</script>

</body>
</html>
