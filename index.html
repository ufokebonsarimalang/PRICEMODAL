<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Master Harga</title>

  <style>
    body {
      font-family: Arial;
      margin: 0;
      background: #f4f6fb;
    }

    .header {
      background: #1e88e5;
      color: white;
      padding: 15px;
      text-align: center;
      font-weight: bold;
    }

    .card {
      margin: 15px;
      background: white;
      padding: 15px;
      border-radius: 12px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.1);
    }

    input {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border-radius: 8px;
      border: 1px solid #ddd;
    }

    button {
      width: 100%;
      padding: 12px;
      background: #1e88e5;
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: bold;
    }

    .item {
      padding: 10px;
      border-bottom: 1px solid #eee;
    }

    .harga {
      font-weight: bold;
      color: green;
    }
  </style>
</head>

<body>

<div class="header">
  💰 MASTER HARGA TOKO
</div>

<div class="card">
  <input id="tipe" placeholder="Cari tipe (contoh: A14)">
  <button onclick="cari()">CARI</button>
</div>

<div class="card" id="hasil">
  Hasil akan muncul di sini
</div>

<script>
const API_URL = "https://script.google.com/macros/s/XXXXX/exec";
// 🔥 ganti dengan URL Apps Script kamu

function cari() {
  let tipe = document.getElementById("tipe").value;

  fetch(API_URL + "?tipe=" + tipe)
  .then(res => res.json())
  .then(data => {

    let h = document.getElementById("hasil");

    if(data.length === 0){
      h.innerHTML = "❌ Tidak ditemukan";
      return;
    }

    let html = "";

    data.forEach(item => {
      html += `
        <div class="item">
          <b>${item.brand}</b><br>
          ${item.tipe}<br>
          Modal: ${item.modal}<br>
          <span class="harga">Rp ${item.harga}</span>
        </div>
      `;
    });

    h.innerHTML = html;
  });
}
</script>

</body>
</html>
